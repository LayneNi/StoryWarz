<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta name="theme-color" content="#10090c">
  <title>Story Warz — Play</title>

  <link rel="stylesheet" href="/style.css">

  <script src="/socket.io/socket.io.js" defer></script>
  <script src="/app.js" defer></script>
</head>

<body data-role="player">
  <header>
    <strong class="brand">
      <svg class="brand-mark" viewBox="0 0 64 76" aria-hidden="true">
        <path d="M19 18c-7-3-10-9-8-15 4 5 8 7 13 8"/>
        <path d="M45 18c7-3 10-9 8-15-4 5-8 7-13 8"/>
        <path d="M13 33c0-13 8-22 19-22s19 9 19 22c0 10-7 14-13 20-3 3-4 5-4 9H29c0-8 3-12 8-17 5-5 8-8 8-13 0-7-5-12-13-12s-13 5-13 13H13zM28 68h9v7h-9z"/>
      </svg>
      <span>STORY <b>WARZ</b></span>
    </strong>

    <span id="connection" role="status">
      Connecting…
    </span>
  </header>

  <main>
    <p id="phone-controller-eyebrow" class="eyebrow">
      THE STORYTELLING SHOWDOWN · PHONE CONTROLLER
    </p>

    <p id="notice" role="status"></p>
    <p id="error" role="alert"></p>

    <div id="screen"></div>
    <div id="countdown-overlay" class="reveal-countdown" hidden>
      <div class="reveal-countdown-card" role="status" aria-live="assertive" aria-atomic="true">
        <p class="countdown-label">REVEAL</p>
        <div class="countdown-display">
          <svg class="countdown-mark" viewBox="0 0 64 76" aria-hidden="true">
            <path d="M19 18c-7-3-10-9-8-15 4 5 8 7 13 8"/>
            <path d="M45 18c7-3 10-9 8-15-4 5-8 7-13 8"/>
            <path d="M13 33c0-13 8-22 19-22s19 9 19 22c0 10-7 14-13 20-3 3-4 5-4 9H29c0-8 3-12 8-17 5-5 8-8 8-13 0-7-5-12-13-12s-13 5-13 13H13zM28 68h9v7h-9z"/>
          </svg>
          <strong id="countdown-number">5</strong>
          <svg class="countdown-mark" viewBox="0 0 64 76" aria-hidden="true">
            <path d="M19 18c-7-3-10-9-8-15 4 5 8 7 13 8"/>
            <path d="M45 18c7-3 10-9 8-15-4 5-8 7-13 8"/>
            <path d="M13 33c0-13 8-22 19-22s19 9 19 22c0 10-7 14-13 20-3 3-4 5-4 9H29c0-8 3-12 8-17 5-5 8-8 8-13 0-7-5-12-13-12s-13 5-13 13H13zM28 68h9v7h-9z"/>
          </svg>
        </div>
      </div>
    </div>
  </main>

  <footer>
    Keep this page open while you play.
  </footer>
</body>
</html>
